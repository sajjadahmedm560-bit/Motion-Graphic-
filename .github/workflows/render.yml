name: Render video
on:
  push:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip project
        run: unzip -q music-download-intro.zip
      - name: Install
        working-directory: music-download-intro
        run: npm install
      - name: Render
        working-directory: music-download-intro
        run: npx remotion render src/index.ts Main out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: music-download-intro/out/video.mp4
